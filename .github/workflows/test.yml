name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run tests (including desktop behavior)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm test
          else
            npm test
          fi
        env:
          REVIEWAGENT_HOME: ${{ runner.temp }}/reviewagent-tests
          PYTHONUTF8: '1'
      - if: runner.os == 'macOS'
        run: bash desktop-app/build-mac.sh
